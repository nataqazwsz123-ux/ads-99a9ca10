const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dLabel=iso=>{const [y,m,d]=iso.split("-").map(Number);return d+" "+MONTHS[m-1]};
const dShort=iso=>iso.slice(8,10)+"."+iso.slice(5,7);
const marketOf=(n,fb)=>{const m=String(n||"").toUpperCase().match(/(^|[\/\s\-_+])(BG|HU|RO|GR|DE|PL)(?=$|[\/\s\-_.+%])/);return m?m[2]:fb};
const rf=v=>nf(v*100,0)+"%";
const fmtCv=v=>nf(v,v%1?1:0);

/* ---------- data prep ---------- */
let D=null;
function prep(){
  const d=S.data||{accounts:[],campaigns:[],ads:[],cdaily:[],daily:[]},G=S.gdata;
  const accCur={};(d.accounts||[]).forEach(a=>accCur[a.code]=a.cur);
  const meta=(d.campaigns||[]).map(c=>Object.assign({},c,{plat:"m",mk:marketOf(c.n,c.a),cur:accCur[c.a]||"EUR",conv:g(c,"pu")}));
  const gAcc={};((G&&G.accounts)||[]).forEach(a=>gAcc[a.id]=a);
  const goog=((G&&G.camps)||[]).map(c=>Object.assign({},c,{plat:"g",mk:marketOf(c.n,"—"),cur:(gAcc[c.a]||{}).cur||"EUR",accName:(gAcc[c.a]||{}).name||c.a,conv:g(c,"cv")}));
  const dset=new Set();(d.cdaily||[]).forEach(x=>dset.add(x.d));((G&&G.cd)||[]).forEach(x=>dset.add(x.d));
  if(d.since&&d.until){let t=new Date(d.since+"T12:00:00Z");const e=new Date(d.until+"T12:00:00Z");while(t<=e){dset.add(t.toISOString().slice(0,10));t=new Date(t.getTime()+864e5)}}
  const days=[...dset].sort();
  const mDaily={};(d.cdaily||[]).forEach(x=>{(mDaily[x.cid]=mDaily[x.cid]||[]).push(x)});
  const gDaily={};((G&&G.cd)||[]).forEach(x=>{(gDaily[x.c]=gDaily[x.c]||[]).push(x)});
  D={meta,goog,days,mDaily,gDaily,accounts:d.accounts||[],gAccounts:(G&&G.accounts)||[],ads:d.ads||[]};
}
const mkOK=c=>S.mk==="all"||c.mk===S.mk;
const metaOK=c=>mkOK(c)&&(S.acc==="all"||c.a===S.acc)&&(S.who==="all"||(S.who==="me")===!!c.me)&&(S.obj==="all"||(OBJ[c.o]||c.o)===S.obj)&&(S.act==="all"||c.st==="ACTIVE");
function sum(rows,keys){const t={n:rows.length};keys.forEach(k=>t[k]=0);rows.forEach(r=>keys.forEach(k=>t[k]+=g(r,k)));return t}
function dailyOf(rows,field){ // returns {date:value} summed across campaigns
  const o={};rows.forEach(c=>{const arr=c.plat==="m"?D.mDaily[c.id]:D.gDaily[c.id];(arr||[]).forEach(x=>{const v=field==="conv"?(c.plat==="m"?g(x,"pu"):g(x,"cv")):g(x,field);o[x.d]=(o[x.d]||0)+v})});return o}

/* ---------- small renderers ---------- */
function seg(key,opts,cur,label){return `<div class="ctl">${label?`<span class="ctl-label">${esc(label)}</span>`:""}<div class="seg" role="group" aria-label="${esc(label||key)}">`+opts.map(([v,l])=>`<button type="button" data-set="${key}" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}</button>`).join("")+`</div></div>`}
const stTag=st=>{const [l,cl]=ST[st]||[st||"—",""];return `<span class="st ${cl}"><i></i>${esc(l)}</span>`};
function roasBadge(r,s){if(!s)return "";if(!r)return `<span class="badge bad">нет продаж</span>`;if(r<1)return `<span class="badge bad">убыток</span>`;if(r>=3)return `<span class="badge good">сильный</span>`;return ""}
const roasCls=r=>r>=3?"r-good":r>0&&r<1?"r-bad":"";
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(k*p>=v)return k*p}return 10*p}

function spark(vals,color){
  if(!vals.length||vals.every(v=>!v))return `<svg class="spark" viewBox="0 0 100 26" aria-hidden="true"><line x1="0" x2="100" y1="24" y2="24" stroke="var(--line)"/></svg>`;
  const mx=Math.max(...vals)||1,n=vals.length,x=i=>n<2?50:i/(n-1)*100,y=v=>23-v/mx*20;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,24 ${pts} 100,24" fill="${color}" fill-opacity=".1" stroke="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* stacked columns: series=[{name,color,vals:{date:v}}] */
function columns(days,series,fmt,H=210,Wmax=760){
  const W=Math.round(Math.min(Wmax,Math.max(320,innerWidth-74))),pl=46,pr=6,pt=10,pb=24,tot=days.map(d=>series.reduce((a,s)=>a+(s.vals[d]||0),0));
  const top=niceMax(Math.max(...tot,0)),y=v=>pt+(H-pt-pb)*(1-v/top),n=days.length||1,gap=(W-pl-pr)/n,bw=Math.min(40,gap*.62);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График по дням">`;
  [0,top/2,top].forEach(t=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-7}" y="${y(t)+4}" text-anchor="end">${esc(fmt(t,true))}</text>`});
  days.forEach((d,i)=>{let acc=0;const x=pl+gap*i+(gap-bw)/2;const segs=series.map(se=>({se,v:se.vals[d]||0})).filter(o=>o.v>0);
    segs.forEach((o,j)=>{const y0=y(acc),y1=y(acc+o.v);acc+=o.v;let h=y0-y1;const last=j===segs.length-1,g2=j>0?2:0;h=Math.max(0,h-g2);const yt=y0-g2-h;
      if(h<=0)return;const r=last?Math.min(4,bw/2,h):0;
      s+=r?`<path d="M${x},${y0-g2} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${y0-g2} Z" fill="${o.se.color}"/>`:`<rect x="${x}" y="${yt}" width="${bw}" height="${h}" fill="${o.se.color}"/>`});
    const tip=dLabel(d)+(series.length>1?"\n"+series.map(se=>`${se.name}: ${fmt(se.vals[d]||0)}`).join("\n")+`\nВсего: ${fmt(tot[i])}`:`: ${fmt(tot[i])}`);
    s+=`<rect class="hit" x="${pl+gap*i}" y="${pt}" width="${gap}" height="${H-pt-pb}" data-tip="${esc(tip)}"/>`;
    if(n<=12||i%Math.ceil(n/10)===0)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${dShort(d)}</text>`});
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<div class="chart">${s}</svg></div>`;
}

/* horizontal bars: items=[{label,segs:[{v,color,tip}],val,sub,act}] */
function hbars(items,opt={}){
  if(!items.length)return `<div class="muted" style="font-size:12.5px">Нет данных под фильтр</div>`;
  const mx=opt.max||niceMax(Math.max(...items.map(it=>it.segs.reduce((a,s)=>a+s.v,0)),opt.ref||0));
  return `<div class="hb">`+items.map(it=>{
    const segs=it.segs.filter(s=>s.v>0).map(s=>`<span style="width:${s.v/mx*100}%;background:${s.color}" data-tip="${esc(s.tip||"")}"></span>`).join("");
    const ref=opt.ref?`<i class="hb-ref" style="left:${opt.ref/mx*100}%"></i>`:"";
    return `<div class="hb-row ${it.act?"click":""}" ${it.act?`data-act="${esc(it.act)}" tabindex="0" role="button"`:""}><span class="hb-l" title="${esc(it.label)}">${esc(it.label)}</span><div class="hb-t">${segs}${ref}</div><span class="hb-v num">${it.val}${it.sub?`<small>${it.sub}</small>`:""}</span></div>`}).join("")+`</div>`;
}

function funnel(t,color){
  const steps=[["Показы","i"],["Клики по ссылке","cl"],["Просмотры лендинга","lpv"],["Корзина","atc"],["Оформление","ic"],["Покупки","pu"]].filter(([l,k])=>k!=="lpv"||t.lpv);
  return `<div class="funnel">`+steps.map(([l,k],i)=>{const v=t[k]||0,prev=i?t[steps[i-1][1]]||0:0,conv=i&&prev?v/prev:null;
    const w=i===0?100:Math.max(conv?Math.min(conv*100,100):0,v?1.5:0);
    return `<div class="fs" data-tip="${esc(l+": "+nf(v)+(i?"\nКонверсия из шага «"+steps[i-1][0]+"»: "+(conv!=null?nf(conv*100,2)+"%":"—"):""))}"><span class="fl">${l}</span><div class="ft"><span style="width:${w}%;background:${color};opacity:${i?1:.35}"></span><b class="num">${nf(v)}</b></div><span class="fc num">${i?`<b>${conv!=null?nf(conv*100,conv<.01?2:1)+"%":"—"}</b>от пред. шага`:"100%"}</span></div>`}).join("")+`</div>`;
}

/* ---------- header, tabs, filters ---------- */
function renderStatus(){
  const parts=[];
  if(S.data){const up=new Date(S.data.updatedAt),age=(Date.now()-up)/60000,c=age<90?"good":age<360?"warn":"bad";
    parts.push(`<span class="pill ${c}"><span class="dot"></span>${age<90?"Данные свежие":age<360?"Синхронизация задерживается":"Данные устарели"}</span>`);
    parts.push(`<span class="pill num">Meta: ${esc(up.toLocaleString("ru-RU",{timeZone:"Europe/Kyiv",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>`)}
  if(S.gdata&&S.gdata.updatedAt)parts.push(`<span class="pill num">Google: ${esc(new Date(S.gdata.updatedAt).toLocaleString("ru-RU",{timeZone:"Europe/Kyiv",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>`);
  if(S.data)parts.push(`<span class="pill num">${dLabel(S.data.since)} – ${dLabel(S.data.until)}</span>`);
  document.getElementById("status").innerHTML=parts.join("");
}
function renderTabs(){

/* ---------- KPI tile ---------- */
function kpi(o){

  return `<${tag} class="kpi" ${o.pick?`type="button" data-set="${o.pick[0]}" data-v="${o.pick[1]}" aria-pressed="${o.on?"true":"false"}"`:""} ${o.tip?`data-tip="${esc(o.tip)}"`:""}><span class="k"><span>${o.k}</span>${o.pick?`<span class="hint">${o.on?"на графике":"показать"}</span>`:""}</span><span class="v num">${o.v}</span><span class="sub num">${o.sub||""}</span>${o.sp!=null?o.sp:""}</${tag}>`;
}
const series=(obj,days)=>days.map(d=>obj[d]||0);

/* ---------- OVERVIEW ---------- */
function overview(){
  const days=D.days;
  const mE=D.meta.filter(c=>mkOK(c)&&c.cur==="EUR"),gE=D.goog.filter(c=>mkOK(c)&&c.cur==="EUR"),pl=D.meta.filter(c=>mkOK(c)&&c.cur==="PLN");
  const tm=sum(mE,["s","pv","conv","cl","i"]),tg=sum(gE,["s","pv","conv","cl","i"]);
  const T={s:tm.s+tg.s,pv:tm.pv+tg.pv,conv:tm.conv+tg.conv,cl:tm.cl+tg.cl,i:tm.i+tg.i};
  const dm={},dg={};["s","pv","conv","cl","i"].forEach(f=>{dm[f]=dailyOf(mE,f);dg[f]=dailyOf(gE,f)});
  const tot=f=>days.map(d=>(dm[f][d]||0)+(dg[f][d]||0));
  const M={s:["Расходы",v=>money(v,"EUR",0)],pv:["Выручка",v=>money(v,"EUR",0)],conv:["Продажи",v=>fmtCv(v)],cl:["Клики",v=>nf(v)],i:["Показы",v=>nf(v)]};
  const split=(a,b,f)=>`Meta ${f(a)} · Google ${f(b)}`;
  let h=`<section><div class="sec-h"><h2>Итоги по евро-кабинетам</h2><p>Meta (Zenet GmbH, Zenet BG) и Google Ads (ZENET EUROPA). Нажмите на плитку, чтобы вывести показатель на график.</p></div><div class="kpis">`+
    kpi({k:"Расходы",v:money(T.s,"EUR",0),sub:split(tm.s,tg.s,v=>money(v,"EUR",0)),pick:["mO","s"],on:S.mO==="s",sp:spark(tot("s"),"var(--ink-2)")})+
    kpi({k:"Выручка",v:money(T.pv,"EUR",0),sub:split(tm.pv,tg.pv,v=>money(v,"EUR",0)),pick:["mO","pv"],on:S.mO==="pv",sp:spark(tot("pv"),"var(--ink-2)")})+
    kpi({k:"ROAS",v:T.s?rf(T.pv/T.s):"—",sub:`Meta ${tm.s?rf(tm.pv/tm.s):"—"} · Google ${tg.s?rf(tg.pv/tg.s):"—"}`,tip:"ROAS = выручка ÷ расходы × 100%.\n100% = в ноль, выше 100% = реклама окупается",sp:spark(days.map((d,i)=>{const s=tot("s")[i];return s?tot("pv")[i]/s:0}),"var(--ink-2)")})+
    kpi({k:"Продажи",v:fmtCv(T.conv),sub:`Meta ${nf(tm.conv)} · Google ${fmtCv(tg.conv)}`,pick:["mO","conv"],on:S.mO==="conv",tip:"Meta: покупки по пикселю\nGoogle: конверсии из Google Ads",sp:spark(tot("conv"),"var(--ink-2)")})+
    kpi({k:"Стоимость продажи",v:T.conv?money(T.s/T.conv,"EUR",2):"—",sub:`Meta ${tm.conv?money(tm.s/tm.conv,"EUR",0):"—"} · Google ${tg.conv?money(tg.s/tg.conv,"EUR",0):"—"}`,tip:"CPA = расходы ÷ продажи"})+
    kpi({k:"Клики",v:nf(T.cl),sub:`CTR ${pct(T.cl,T.i)} · CPC ${T.cl?money(T.s/T.cl,"EUR",2):"—"}`,pick:["mO","cl"],on:S.mO==="cl",sp:spark(tot("cl"),"var(--ink-2)")})+`</div></section>`;
  const [ml,mf]=M[S.mO]||M.s;
  h+=`<section class="grid2"><div class="card pad"><div class="chart-h"><h2>${ml} по дням</h2><div class="legend"><span><i style="background:var(--meta)"></i>Meta Ads</span><span><i style="background:var(--google)"></i>Google Ads</span></div></div>${columns(days,[{name:"Meta",color:"var(--meta)",vals:dm[S.mO]},{name:"Google",color:"var(--google)",vals:dg[S.mO]}],(v,ax)=>ax?nf(v,v%1&&v<10?1:0):mf(v))}</div>`;
  // platform share
  const pr=(a,b)=>a+b?a/(a+b)*100:0;
  h+=`<div class="card pad" style="display:grid;gap:14px"><h2>Meta и Google</h2>`+
    [["Расходы",tm.s,tg.s,v=>money(v,"EUR",0)],["Выручка",tm.pv,tg.pv,v=>money(v,"EUR",0)],["Продажи",tm.conv,tg.conv,fmtCv],["Клики",tm.cl,tg.cl,v=>nf(v)]].map(([l,a,b,f])=>`<div style="display:grid;gap:5px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">${l}</span><span class="num">${f(a+b)}</span></div><div class="split"><span style="width:${pr(a,b)}%;background:var(--meta)" data-tip="${esc("Meta: "+f(a)+" ("+nf(pr(a,b),0)+"%)")}"></span><span style="flex:1;background:var(--google)" data-tip="${esc("Google: "+f(b)+" ("+nf(100-pr(a,b),0)+"%)")}"></span></div><div style="display:flex;justify-content:space-between;font-size:11.5px" class="muted num"><span>Meta ${nf(pr(a,b),0)}%</span><span>Google ${nf(a+b?100-pr(a,b):0,0)}%</span></div></div>`).join("")+
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px"><div><span class="muted">ROAS Meta</span><br><b class="num ${roasCls(tm.s?tm.pv/tm.s:0)}">${tm.s?rf(tm.pv/tm.s):"—"}</b></div><div><span class="muted">ROAS Google</span><br><b class="num ${roasCls(tg.s?tg.pv/tg.s:0)}">${tg.s?rf(tg.pv/tg.s):"—"}</b></div></div></div></section>`;
  // markets
  const mks=MARKETS.filter(m=>m!=="PL"&&(mE.some(c=>c.mk===m)||gE.some(c=>c.mk===m)));
  const mrow=m=>{const a=sum(mE.filter(c=>c.mk===m),["s","pv","conv"]),b=sum(gE.filter(c=>c.mk===m),["s","pv","conv"]);return {m,a,b,s:a.s+b.s,pv:a.pv+b.pv,conv:a.conv+b.conv}};

  h+=`<section class="grid2e"><div class="card pad"><div class="chart-h"><h2>Бюджет по рынкам</h2><div class="legend"><span><i style="background:var(--meta)"></i>Meta</span><span><i style="background:var(--google)"></i>Google</span></div></div>`+
    hbars(mr.map(r=>({label:(MK_NAME[r.m]||r.m)+" · "+r.m,segs:[{v:r.a.s,color:"var(--meta)",tip:`${r.m} Meta: ${money(r.a.s,"EUR",0)}`},{v:r.b.s,color:"var(--google)",tip:`${r.m} Google: ${money(r.b.s,"EUR",0)}`}],val:money(r.s,"EUR",0),act:"mk:"+r.m})))+
    `<p class="note" style="margin-top:10px">Нажмите на рынок, чтобы отфильтровать весь дашборд.${pl.length?" Польша считается в злотых, она в карточке справа и на вкладке «Рынки».":""}</p></div>`;

    hbars(mr.filter(r=>r.s).sort((p,q)=>q.pv/q.s-p.pv/p.s).map(r=>{const v=r.pv/r.s;return {label:(MK_NAME[r.m]||r.m)+" · "+r.m,segs:[{v,color:"var(--accent)",tip:`${r.m}: выручка ${money(r.pv,"EUR",0)} при расходах ${money(r.s,"EUR",0)}`}],val:rf(v),sub:roasBadge(v,r.s),act:"mk:"+r.m}}),{ref:1});
  if(pl.length){const p=sum(pl,["s","pv","conv","ld"]);h+=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;align-items:center"><b>Польша, zł</b><span class="num">Расходы ${money(p.s,"PLN",0)}</span><span class="num">Покупки ${nf(p.conv)}</span><span class="num">ROAS ${p.s&&p.pv?rf(p.pv/p.s):"—"}</span><span class="num">Лиды ${nf(p.ld)}</span><button type="button" class="reset" data-act="mk:PL">Открыть Польшу</button></div>`}
  h+=`</div></section>`;
  // signals
  const all=D.meta.filter(mkOK).concat(D.goog.filter(mkOK));
  const best=all.filter(c=>g(c,"s")>=30&&g(c,"pv")>0).sort((p,q)=>q.pv/q.s-p.pv/p.s).slice(0,6);
  const waste=all.filter(c=>g(c,"s")>=40&&!c.conv&&!g(c,"ld")).sort((p,q)=>q.s-p.s).slice(0,6);
  const loss=all.filter(c=>g(c,"s")>=40&&c.conv&&g(c,"pv")>0&&g(c,"pv")/g(c,"s")<1).sort((p,q)=>q.s-p.s).slice(0,4);
  const sigRow=(c,right)=>`<button type="button" class="sig" data-act="c:${c.plat}:${esc(c.id)}"><span class="plat ${c.plat}">${c.plat==="m"?"M":"G"}</span><span style="min-width:0"><span class="sig-n">${esc(c.n)}</span><small>${c.plat==="m"?esc(c.a)+" кабинет":"Google Ads"} · рынок ${esc(c.mk)} · ${stTag(c.st)}</small></span><span class="sv num">${right}</span></button>`;
  h+=`<section><div class="sec-h"><h2>Что работает и что нет</h2><p>Нажмите на кампанию, чтобы открыть подробности</p></div><div class="grid2e">
    <div class="card pad"><h3 style="margin-bottom:6px">Лучшие по окупаемости</h3><div class="signals">${best.map(c=>sigRow(c,`ROAS <b class="r-good">${rf(c.pv/c.s)}</b><br><span class="muted">${money(c.s,c.cur,0)} → ${money(c.pv,c.cur,0)}</span>`)).join("")||'<span class="muted">Пока нет кампаний с выручкой</span>'}</div></div>
    <div class="card pad"><h3 style="margin-bottom:6px">Тратят без продаж</h3><div class="signals">${waste.map(c=>sigRow(c,`<b>${money(c.s,c.cur,0)}</b><br><span class="muted">${c.plat==="m"?nf(g(c,"atc"))+" в корзину":nf(g(c,"cl"))+" кликов"}</span>`)).join("")||'<span class="muted">Таких кампаний нет</span>'}</div>

  return h;
}

const MCOLS=[["n","Кампания","l"],["st","Статус","l"],["s","Расходы"],["i","Показы"],["cl","Клики"],["ctr","CTR"],["cpc","CPC"],["atc","Корзина"],["catc","Цена корзины"],["pu","Покупки"],["cpa","CPA"],["pv","Выручка"],["roas","ROAS"],["ld","Лиды"]];
function mval(c,k){const s=g(c,"s");switch(k){case"ctr":return c.i?g(c,"cl")/c.i:0;case"cpc":return c.cl?s/c.cl:0;case"catc":return c.atc?s/c.atc:0;case"cpa":return c.pu?s/c.pu:0;case"roas":return s?g(c,"pv")/s:0;case"n":case"st":return c[k]||"";default:return g(c,k)}}
function sortRows(rows,so,fn){return rows.slice().sort((p,q)=>{const a=fn(p,so.k),b=fn(q,so.k);const r=typeof a==="string"?a.localeCompare(b,"ru"):a-b;return so.d==="asc"?r:-r})}
function metaTable(rows,PC){
  const q=S.q.trim().toLowerCase(),moneyK=["s","cpc","catc","cpa","pv"].includes(S.sortM.k);let list=sortRows(rows.filter(c=>!q||c.n.toLowerCase().includes(q)),S.sortM,mval);if(moneyK)list=list.filter(c=>c.cur===PC).concat(list.filter(c=>c.cur!==PC));
  const mx=Math.max(...rows.filter(c=>c.cur===PC).map(c=>g(c,"s")),1);

    MCOLS.map(([k,l,a])=>`<th class="${a||""}"><button type="button" class="th-btn" data-sort="M:${k}" ${S.sortM.k===k?`data-dir="${S.sortM.d}"`:""}>${l}</button></th>`).join("")+`</tr></thead><tbody>`;
  h+=list.map(c=>{const s=g(c,"s"),cur=c.cur,r=s?g(c,"pv")/s:0;
    return `<tr data-act="c:m:${c.id}" tabindex="0"><td><div class="cn"><b>${esc(c.n)}</b><small><span class="sw" style="background:${ACC_COLOR[c.a]}"></span>${esc(c.a)} · ${esc(c.mk)} · ${esc(OBJ[c.o]||c.o||"")}${c.me?` · <span class="badge neu">${OWNER}</span>`:""}</small></div></td><td class="l">${stTag(c.st)}</td>
    <td class="num"><div class="inb"><b>${money(s,cur,0)}</b><span style="width:${cur===PC?s/mx*100:0}%;background:${ACC_COLOR[c.a]}"></span></div></td><td class="num">${nf(g(c,"i"))}</td><td class="num">${nf(g(c,"cl"))}</td><td class="num">${pct(g(c,"cl"),g(c,"i"))}</td><td class="num">${c.cl?money(s/c.cl,cur,2):"—"}</td><td class="num">${nf(g(c,"atc"))}</td><td class="num">${c.atc?money(s/c.atc,cur,2):'<span class="muted">—</span>'}</td>
    <td class="num">${c.pu?"<b>"+nf(c.pu)+"</b>":'<span class="muted">0</span>'}</td><td class="num">${c.pu?money(s/c.pu,cur,2):'<span class="muted">—</span>'}</td><td class="num">${c.pv?money(c.pv,cur,0):'<span class="muted">—</span>'}</td><td class="num ${roasCls(r)}">${r?rf(r):'<span class="muted">—</span>'}</td><td class="num">${c.ld?nf(c.ld):'<span class="muted">0</span>'}</td></tr>`}).join("")||`<tr><td colspan="${MCOLS.length}" class="muted">Ничего не найдено</td></tr>`;
  const t=sum(list,MKEYS),m=sum(list.filter(c=>c.cur===PC),MKEYS);

  return h;

  h+=`<section class="card"><div class="tbl-h"><div style="display:grid;gap:2px"><h2>Все кампании Google Ads</h2><span class="cnt">${list.length} кампаний · нажмите на строку, чтобы открыть кампанию</span></div></div><div class="scroll"><table class="ctable" style="min-width:1180px"><thead><tr>`+
    GC.map(([k,l,a])=>`<th class="${a||""}"><button type="button" class="th-btn" data-sort="G:${k}" ${S.sortG.k===k?`data-dir="${S.sortG.d}"`:""}>${l}</button></th>`).join("")+`</tr></thead><tbody>`+
    list.map(c=>{const s=c.s,r=s?g(c,"pv")/s:0;return `<tr data-act="c:g:${esc(c.id)}" tabindex="0"><td><div class="cn"><b>${esc(c.n)}</b><small>${esc(c.accName)} · рынок ${esc(c.mk)}</small></div></td><td class="l">${esc(GCH[c.ch]||c.ch||"")}</td><td class="l">${stTag(c.st)}</td><td class="num">${c.b?M2(c.b):"—"}</td><td class="num"><div class="inb"><b>${M(s)}</b><span style="width:${s/mx*100}%;background:var(--google)"></span></div></td><td class="num">${nf(c.i)}</td><td class="num">${nf(c.cl)}</td><td class="num">${pct(c.cl,c.i)}</td><td class="num">${c.cl?M2(s/c.cl):"—"}</td><td class="num">${fmtCv(c.conv)}</td><td class="num">${c.conv?M2(s/c.conv):"—"}</td><td class="num">${c.pv?M(c.pv):"—"}</td><td class="num ${roasCls(r)}">${r?rf(r):"—"}</td></tr>`}).join("")+
    `</tbody><tfoot><tr><td>Итого</td><td></td><td></td><td></td><td class="num">${M(t.s)}</td><td class="num">${nf(t.i)}</td><td class="num">${nf(t.cl)}</td><td class="num">${pct(t.cl,t.i)}</td><td class="num">${t.cl?M2(t.s/t.cl):""}</td><td class="num">${fmtCv(t.conv)}</td><td class="num">${t.conv?M2(t.s/t.conv):""}</td><td class="num">${M(t.pv)}</td><td class="num">${t.s?rf(t.pv/t.s):"—"}</td></tr></tfoot></table></div></section>`;
  return h;
}

/* ---------- MARKETS ---------- */
function marketsTab(){
  const mks=MARKETS.filter(m=>D.meta.some(c=>c.mk===m)||D.goog.some(c=>c.mk===m));
  const data=mks.map(m=>{const me=D.meta.filter(c=>c.mk===m),go=D.goog.filter(c=>c.mk===m),a=sum(me,["s","pv","conv","cl","atc","ld"]),b=sum(go,["s","pv","conv","cl"]);const cur=m==="PL"?"PLN":"EUR";
    return {m,cur,me,go,a,b,s:a.s+b.s,pv:a.pv+b.pv,conv:a.conv+b.conv,cl:a.cl+b.cl,act:me.filter(c=>c.st==="ACTIVE").length+go.filter(c=>c.st==="ENABLED").length}}).sort((p,q)=>(q.cur==="EUR")-(p.cur==="EUR")||q.s-p.s);
  let h=`<section><div class="sec-h"><h2>Рынки</h2><p>Meta и Google вместе. Нажмите на карточку, чтобы отфильтровать дашборд по рынку.</p></div><div class="mk-grid">`+data.map(x=>{const r=x.s?x.pv/x.s:0,sh=x.s?x.a.s/x.s*100:0;
    return `<button type="button" class="mk" data-act="mk:${x.m}" aria-pressed="${S.mk===x.m}"><div class="mk-h"><span><b>${x.m}</b> <span class="muted">${esc(MK_NAME[x.m]||"")}</span></span><span class="muted num" style="font-size:12px">${x.me.length+x.go.length} камп. · ${x.act} акт.</span></div>
      <div style="display:grid;gap:4px"><div class="split"><span style="width:${sh}%;background:var(--meta)" data-tip="${esc("Meta: "+money(x.a.s,x.cur,0))}"></span><span style="flex:1;background:var(--google)" data-tip="${esc("Google: "+money(x.b.s,x.cur,0))}"></span></div><div class="muted num" style="display:flex;justify-content:space-between;font-size:11.5px"><span>Meta ${money(x.a.s,x.cur,0)}</span><span>Google ${money(x.b.s,x.cur,0)}</span></div></div>
      <div class="mk-s"><div><span class="k">Расходы</span><span class="v num">${money(x.s,x.cur,0)}</span></div><div><span class="k">Выручка</span><span class="v num">${x.pv?money(x.pv,x.cur,0):"—"}</span></div><div><span class="k">ROAS</span><span class="v num ${roasCls(r)}">${r?rf(r):"—"}</span></div>
      <div><span class="k">Продажи</span><span class="v num">${fmtCv(x.conv)}</span></div><div><span class="k">Цена продажи</span><span class="v num">${x.conv?money(x.s/x.conv,x.cur,0):"—"}</span></div><div><span class="k">В корзину (Meta)</span><span class="v num">${nf(x.a.atc)}</span></div></div></button>`}).join("")+`</div></section>`;
  h+=`<section class="card"><div class="tbl-h"><h2>Сравнение рынков</h2><span class="cnt">Польша в злотых, остальные в евро</span></div><div class="scroll"><table style="min-width:980px"><thead><tr><th class="l" style="padding-left:16px">Рынок</th><th>Расходы Meta</th><th>Расходы Google</th><th>Всего</th><th>Выручка</th><th>ROAS</th><th>Продажи</th><th>Цена продажи</th><th>Клики</th><th>В корзину (Meta)</th><th>Лиды (Meta)</th></tr></thead><tbody>`+
    data.map(x=>{const r=x.s?x.pv/x.s:0;return `<tr><td class="l" style="padding-left:16px"><b>${x.m}</b> <span class="muted">${esc(MK_NAME[x.m]||"")}</span></td><td class="num">${money(x.a.s,x.cur,0)}</td><td class="num">${x.b.s?money(x.b.s,x.cur,0):'<span class="muted">—</span>'}</td><td class="num"><b>${money(x.s,x.cur,0)}</b></td><td class="num">${x.pv?money(x.pv,x.cur,0):"—"}</td><td class="num ${roasCls(r)}">${r?rf(r):"—"}</td><td class="num">${fmtCv(x.conv)}</td><td class="num">${x.conv?money(x.s/x.conv,x.cur,2):"—"}</td><td class="num">${nf(x.cl)}</td><td class="num">${nf(x.a.atc)}</td><td class="num">${nf(x.a.ld)}</td></tr>`}).join("")+`</tbody></table></div></section>`;
  return h;
}

/* ---------- DRAWER ---------- */
function openDrawer(plat,id){S.dr={plat,id};renderDrawer();document.getElementById("drawer").classList.add("on");document.getElementById("scrim").classList.add("on");document.getElementById("drawer").setAttribute("aria-hidden","false");setTimeout(()=>{const x=document.querySelector("#drawer .x");x&&x.focus()},50)}
function closeDrawer(){S.dr=null;document.getElementById("drawer").classList.remove("on");document.getElementById("scrim").classList.remove("on");document.getElementById("drawer").setAttribute("aria-hidden","true")}
function renderDrawer(){
  if(!S.dr)return;const {plat,id}=S.dr,el=document.getElementById("drawer");
  const c=(plat==="m"?D.meta:D.goog).find(x=>String(x.id)===String(id));if(!c){closeDrawer();return}
  const cur=c.cur,s=g(c,"s"),r=s?g(c,"pv")/s:0,days=D.days,M=v=>money(v,cur,0),M2=v=>money(v,cur,2);
  const color=plat==="m"?ACC_COLOR[c.a]:"var(--google)";
  let h=`<div class="dr-h"><div class="dr-top"><div style="display:grid;gap:4px;min-width:0"><span class="eyebrow">${plat==="m"?"Meta Ads · кабинет "+esc(c.a):"Google Ads · "+esc(c.accName)}</span><h2 id="dr-title">${esc(c.n)}</h2></div><button type="button" class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <div class="tags">${stTag(c.st)}<span class="badge neu">рынок ${esc(c.mk)}</span>${plat==="m"?`<span class="badge neu">${esc(OBJ[c.o]||c.o||"")}</span>`:`<span class="badge neu">${esc(GCH[c.ch]||c.ch||"")}</span>`}${plat==="m"&&c.by?`<span class="badge neu">запустил: ${esc(c.by)}</span>`:""}${plat==="m"&&c.c?`<span class="badge neu">создана ${c.c.split("-").reverse().join(".")}</span>`:""}${plat==="m"?(c.db?`<span class="badge neu">бюджет ${M2(c.db)}/день</span>`:c.lb?`<span class="badge neu">бюджет ${M(c.lb)} всего</span>`:`<span class="badge neu">бюджет в группах</span>`):c.b?`<span class="badge neu">бюджет ${M2(c.b)}/день</span>`:""}${roasBadge(r,s)}</div></div><div class="dr-b">`;
  const cells=plat==="m"?[["Расходы",M2(s)],["Покупки",nf(g(c,"pu"))],["Выручка",c.pv?M2(c.pv):"—"],["ROAS",r?rf(r):"—"],["CPA",c.pu?M2(s/c.pu):"—"],["В корзину",nf(g(c,"atc"))],["Цена корзины",c.atc?M2(s/c.atc):"—"],["Оформления",nf(g(c,"ic"))],["Показы",nf(g(c,"i"))],["Охват",nf(g(c,"r"))],["Частота",c.r?nf(c.i/c.r,2):"—"],["CPM",c.i?M2(s/c.i*1000):"—"],["Клики",nf(g(c,"cl"))],["CTR",pct(g(c,"cl"),g(c,"i"))],["CPC",c.cl?M2(s/c.cl):"—"],["Лиды",nf(g(c,"ld"))]]
    :[["Расходы",M2(s)],["Конверсии",fmtCv(c.conv)],["Ценность",c.pv?M2(c.pv):"—"],["ROAS",r?rf(r):"—"],["CPA",c.conv?M2(s/c.conv):"—"],["Показы",nf(c.i)],["Клики",nf(c.cl)],["CTR",pct(c.cl,c.i)],["CPC",c.cl?M2(s/c.cl):"—"],["CPM",c.i?M2(s/c.i*1000):"—"],["Доля в бюджете Google",pct(s,sum(D.goog.filter(x=>x.cur===cur),["s"]).s,0)],["Конв. из клика",pct(c.conv,c.cl,2)]];
  h+=`<div class="mini">${cells.map(([k,v])=>`<div><span class="k">${k}</span><span class="v num">${v}</span></div>`).join("")}</div>`;
  const arr=(plat==="m"?D.mDaily[c.id]:D.gDaily[c.id])||[];const by=f=>{const o={};arr.forEach(x=>o[x.d]=(o[x.d]||0)+g(x,f));return o};
  const resF=plat==="m"?(g(c,"pu")?"pu":g(c,"ld")?"ld":"atc"):"cv",resL={pu:"Покупки",ld:"Лиды",atc:"В корзину",cv:"Конверсии"}[resF];
  h+=`<div class="grid2e"><div class="card pad"><div class="chart-h"><h3>Расходы по дням</h3></div>${columns(days,[{name:"Расходы",color,vals:by("s")}],(v,ax)=>ax?nf(v,v%1&&v<10?1:0):M2(v),180,380)}</div><div class="card pad"><div class="chart-h"><h3>${resL} по дням</h3></div>${columns(days,[{name:resL,color:"var(--ink-2)",vals:by(resF)}],(v,ax)=>ax?nf(v,v%1&&v<10?1:0):fmtCv(v),180,380)}</div></div>`;
  if(plat==="m"){
    h+=`<div class="card pad"><div class="chart-h"><h3>Воронка кампании</h3></div>${funnel(c,color)}</div>`;
    const ads=D.ads.filter(a=>a.cid===c.id).sort((p,q)=>g(q,"s")-g(p,"s")),amx=Math.max(...ads.map(a=>g(a,"s")),1);
    h+=`<div class="card"><div class="tbl-h"><h3>Объявления (${ads.length})</h3><span class="cnt">по расходам</span></div><div class="scroll"><table class="ads" style="min-width:820px"><thead><tr><th class="l" style="padding-left:14px">Объявление / группа</th><th class="l">Статус</th><th>Расходы</th><th>Клики</th><th>CTR</th><th>CPC</th><th>Корзина</th><th>Цена корз.</th><th>Покупки</th><th>Выручка</th></tr></thead><tbody>`+
      (ads.map(a=>`<tr><td class="l" style="padding-left:14px"><div class="adn">${esc(a.n)}<small>${esc(a.as)}</small></div></td><td class="l">${stTag(a.st)}</td><td class="num"><div class="inb"><b>${M2(g(a,"s"))}</b><span style="width:${g(a,"s")/amx*100}%;background:${color}"></span></div></td><td class="num">${nf(g(a,"cl"))}</td><td class="num">${pct(g(a,"cl"),g(a,"i"))}</td><td class="num">${a.cl?M2(a.s/a.cl):"—"}</td><td class="num">${nf(g(a,"atc"))}</td><td class="num">${a.atc?M2(a.s/a.atc):"—"}</td><td class="num">${nf(g(a,"pu"))}</td><td class="num">${a.pv?M2(a.pv):"—"}</td></tr>`).join("")||`<tr><td colspan="10" class="muted" style="padding-left:14px">Нет показов за период</td></tr>`)+`</tbody></table></div></div>`;
  }
  const dayRows=days.filter(d=>arr.some(x=>x.d===d));
  h+=`<div class="card"><div class="tbl-h"><h3>Таблица по дням</h3></div><div class="scroll"><table class="ads"><thead><tr><th class="l" style="padding-left:14px">День</th><th>Расходы</th><th>Показы</th><th>Клики</th>${plat==="m"?"<th>Корзина</th><th>Покупки</th><th>Лиды</th>":"<th>Конверсии</th>"}<th>Выручка</th></tr></thead><tbody>`+
    dayRows.map(d=>{const x=arr.filter(y=>y.d===d).reduce((o,y)=>{["s","i","cl","atc","pu","ld","pv","cv"].forEach(k=>o[k]=(o[k]||0)+g(y,k));return o},{});return `<tr><td class="l num" style="padding-left:14px">${dLabel(d)}</td><td class="num">${M2(x.s)}</td><td class="num">${nf(x.i)}</td><td class="num">${nf(x.cl)}</td>${plat==="m"?`<td class="num">${nf(x.atc)}</td><td class="num">${nf(x.pu)}</td><td class="num">${nf(x.ld)}</td>`:`<td class="num">${fmtCv(x.cv)}</td>`}<td class="num">${x.pv?M2(x.pv):"—"}</td></tr>`}).join("")+`</tbody></table></div></div>`;
  el.innerHTML=h+`</div>`;
}

/* ---------- main render ---------- */
function render(){
  prep();renderStatus();renderTabs();
  const app=document.getElementById("app");
  let h="";
  if(S.tab==="meta")h=S.data?metaTab():`<div class="empty"><b>Нет данных Meta</b></div>`;
  else if(S.tab==="google")h=googleTab();
  else if(S.tab==="mk")h=marketsTab();
  else h=overview();
  app.innerHTML=h;
  document.getElementById("foot").textContent="Источники: Meta Ads API (Zenet GmbH, Zenet BG, Zenet PL 2) и Google Ads (ZENET EUROPA LTD), обновление каждый час. Покупки и выручка Meta по атрибуции по умолчанию (7 дней после клика, 1 день после просмотра); конверсии и ценность Google по данным Google Ads. Польша ведётся в злотых и в евро-итоги не входит. Рынок определяется по названию кампании. «Кампании Натальи»: созданные с аккаунта, через который Наталья работает в Ads Manager.";
  if(S.dr)renderDrawer();
}

/* ---------- events ---------- */
function act(a){
  if(a==="close"){closeDrawer();return}
  if(a==="resetM"){S.acc="all";S.who="all";S.obj="all";S.act="all";save();render();return}
  if(a.startsWith("mk:")){const m=a.slice(3);S.mk=S.mk===m&&S.tab!=="over"?"all":m;if(S.tab==="mk")S.tab="over";save();render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a.startsWith("c:")){const [,p,id]=a.split(":");openDrawer(p,id)}
}
document.addEventListener("click",e=>{
  if(!D)return;
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;save();render();return}
  const st=e.target.closest("[data-set]");if(st){S[st.dataset.set]=st.dataset.v;save();render();return}
  const so=e.target.closest("[data-sort]");if(so){const [t,k]=so.dataset.sort.split(":"),o=t==="M"?S.sortM:S.sortG;if(o.k===k)o.d=o.d==="desc"?"asc":"desc";else{o.k=k;o.d=["n","st","ch"].includes(k)?"asc":"desc"}render();return}
  const a=e.target.closest("[data-act]");if(a){act(a.dataset.act);return}
});
document.getElementById("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.dr){closeDrawer();return}
  const a=e.target.closest&&e.target.closest("[data-act][tabindex]");if(a&&(e.key==="Enter"||e.key===" ")){e.preventDefault();act(a.dataset.act)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}});
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t||!t.dataset.tip){tip.style.display="none";return}
  tip.textContent=t.dataset.tip;tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+18;tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("scroll",()=>{tip.style.display="none"},true);
let rzT,lastW=innerWidth;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-lastW)>40&&D){lastW=innerWidth;render()}},200)});

function showEmpty(t,s){document.getElementById("app").innerHTML=`<div class="empty"><b>${esc(t)}</b><span>${esc(s)}</span></div>`}
async function getJSON(u){try{const r=await fetch(u+"?v="+Math.floor(Date.now()/6e4),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
async function load(){
  const [m,gd]=await Promise.all([getJSON("data/meta.json"),getJSON("data/google.json")]);
  const changed=(m&&(!S.data||m.updatedAt!==S.data.updatedAt))||(gd&&(!S.gdata||gd.updatedAt!==S.gdata.updatedAt));
  if(gd)S.gdata=gd;
  if(m)S.data=m;
  if(S.data){if(changed)render();else renderStatus()}
  else showEmpty("Не удалось загрузить данные","Обновите страницу.");
}
load();
setInterval(()=>{if(document.visibilityState==="visible")load()},5*60*1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
})();
</script>

</body></html>
